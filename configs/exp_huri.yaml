# HuRI study-bias test on the HuRI-covered genes (huri universe, 4,882 genes, 195 positives).
# Every other graph is subsampled to HuRI's edge count (<graph>_em, 18,081 edges), so a
# smaller graph effect on HuRI can't be explained by HuRI simply having fewer edges.
# HuRI still misses most membrane targets: see results/coverage_table.csv.
name: huri
grid:
  universe: [huri]
  graph: [huri, string_exp_em, intact_em, string_em, reactome_fi_em]
  copy: [real, rw0, rw1, rw2, empty, shufattr]
  labels: [minikel]
  feats: [all]
  split: [random]
  seed: [0, 1, 2, 3, 4]
  model: [deg_lr, rf_struct, labelprop, mlp_feat, rf_feat, rf_feat_struct,
          sign_feat, cs_feat, gcn_none, gcn_feat, sage_feat, gat_feat, gat_edge_feat, gp]
  loss: [nnpu, pn]
