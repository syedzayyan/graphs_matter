# Headline: does the graph matter inside graph models? Real vs rewired vs empty graph (vs
# shuffled edge vectors for the edge-aware model), on STRING >= 700 and on STRING
# experimental-only (the clean comparison: no database/text-mining channels, so no pathway
# or co-mention information leaking in through the edges). Minikel labels, random + Pfam
# splits, with and without Open Targets tractability features, both losses, 5 seeds.
name: headline
grid:
  universe: [main]
  graph: [string, string_exp]
  copy: [real, rw0, rw1, rw2, empty, shufattr]
  labels: [minikel]
  feats: [all, no_tract]
  split: [random, pfam]
  seed: [0, 1, 2, 3, 4]
  model: [deg_lr, rf_struct, labelprop, mlp_feat, rf_feat, mlp_feat_struct, rf_feat_struct,
          sign_feat, cs_feat, gcn_none, gcn_feat, sage_feat, gat_none, gat_feat, gat_edge_feat, gp]
  loss: [nnpu, pn]
