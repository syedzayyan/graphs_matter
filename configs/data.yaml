# Stage-1 data build. Every downstream artefact is derived from these choices.
# Data location: $GHELPS_DATA (default <repo>/data), see ghelps/paths.py.

graphs:
  string:
    combined_score_min: 700
  string_exp:
    # Direct experimental channel only (no *_transferred), STRING "medium" cut-off.
    experiments_min: 400
  intact:
    miscore_min: 0.45                  # IntAct's own medium-confidence threshold
    keep_types: ["association", "physical association", "direct interaction",
                 "phosphorylation reaction", "dephosphorylation reaction",
                 "ubiquitination reaction", "protein cleavage", "cleavage reaction",
                 "methylation reaction", "adp ribosylation reaction", "enzymatic reaction"]
  reactome_fi:
    # Curated functional interactions only: drop pairs annotated purely "predicted" (the
    # Reactome FI naive-Bayes predictions); pairs with curated support are kept.
    include_predicted: false
  huri: {}
  biogrid09:
    # BioGRID 2.0.60 (27 Dec 2009): a graph as known before the time split's cut-off.
    # Physical systems only (genetic-interaction and RNA systems dropped).
    physical_systems: ["Affinity Capture-Western", "Two-hybrid", "Reconstituted Complex", "Affinity Capture-MS",
                       "Biochemical Activity", "Co-purification", "Affinity Capture-Luminescence",
                       "Co-crystal Structure", "Far Western", "Co-fractionation", "Protein-peptide",
                       "Co-localization", "FRET", "PCA"]
  string_sub09:
    # Density control for biogrid09: the STRING graph's own edges, a uniform random sample of
    # as many as biogrid09 has on the same genes. Separates "sparser" from "dated".
    sample_from: string
    match_edges_of: biogrid09
    seed: 0

rewire:
  n_copies: 3
  swaps_per_edge: 10
  seed: 0

labels:
  minikel_min_phase: "Phase III"       # >= Phase III counts as positive

# Gene universes: one per graph, its own (protein-coding) node set. Each graph is a separate
# test with its own genes, positives, splits and tuned hyperparameters. Three graphs span the
# spectrum: STRING >= 700 (literature + curated + experimental), Reactome FI (curated only),
# HuRI (systematic Y2H, literature-free). string_exp and intact are still built as raw edge
# lists because their membership bits are part of the edge vectors.
universes:
  string: [string]
  reactome_fi: [reactome_fi]
  huri: [huri]

# Dated graphs (scripts/build_dated_graphs.py): extra graphs built on an existing universe's
# genes, without changing it. Genes absent from the dated graph are isolated nodes.
dated_graphs:
  string: [biogrid09, string_sub09]   # in build order: the control matches biogrid09

# Pathway-coherent subgraph (graph condition "pwsub"): keep only edges whose endpoints share
# a specific Reactome pathway. Removes cross-module edges without breaking modules apart.
pathway_subgraph:
  max_pathway_genes: 100

# Attention-free node features (feats: attn_free): ESM-2 embeddings of the canonical UniProt
# sequence, sequence-derived features (length, composition, Kyte-Doolittle TM helices) and
# GTEx median expression. Measured / computed uniformly, independent of study intensity.
attention_free:
  esm_model: facebook/esm2_t12_35M_UR50D   # 35M runs on CPU; esm2_t33_650M_UR50D on a GPU

splits:
  n_seeds: 7                      # 0-4 evaluation (experiment configs), 5-6 tuning only (tune.yaml)
  leiden_resolution: 5.0     # ~70-85 communities, none > 5% of genes
  leiden_seed: 0
  recent_from_year: 2021          # rcnt stand-in: first Minikel launch >= this year
  time_split_year: 2010           # time split: train on targets first drugged (ChEMBL first approval)
                                  # before this year, test on targets first drugged from it on
  neg_per_pos: 5                  # matched negatives per test positive
  pathway_match_max_genes: 100    # same-pathway negatives use specific pathways only
  label_sets: [minikel, minikel_perm, minikel_famperm, membrane]
  permutation_seed: 0             # minikel_perm: Minikel labels randomly permuted (nonsense test)
                                  # minikel_famperm: permuted only within Pfam families (genes
                                  # without Pfam form one group): if a model still scores, it
                                  # learned family membership, not the gene
  # Therapeutic-wave transfer splits (Minikel only): test positives are genes whose >= Phase III
  # indications all fall in one wave; training positives never touched that wave; genes in the
  # wave and elsewhere are excluded. Generic MeSH areas are ignored.
  waves:
    oncology: [oncology, hematology]
    cns: [neurology, psychiatry, ophthalmology]
    cardiometabolic: [cardiovascular, metabolic, endocrine, digestive]
    inflammation: [immune, dermatology, respiratory, musculoskeletal]
    infection: [infection]
  wave_generic_areas: [signs/symptoms, other, congenital]
  wave_min_test_genes: 30         # waves with fewer single-wave genes in a universe are skipped

# Rolling time origins (report 6.7, scripts/analysis.py: rolling_origins). The 2010 split
# repeated at several cut-offs T, with targets first drugged in [T, T + window) as the future
# targets, so every origin has the same follow-up. Only rankers that need nothing dated at T
# beyond PubMed counts and approval years: PubMed before T, known targets in the gene's Pfam
# families, closeness to known targets (today's graph: leaks), and an out-of-fold RF on
# attention-free features. The dated GO / KEGG / BioGRID inputs exist only for 2009.
rolling:
  origins: [2000, 2005, 2010, 2015]
  window: 5
  folds: 5
