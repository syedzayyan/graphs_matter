# Nonsense / family controls.
#   minikel_perm: Minikel labels permuted across all genes -> every model should score ~0.5.
#   minikel_famperm: labels permuted only within Pfam families -> whatever survives was learned
#   from family membership (self-similarity to past targets), not from the gene itself.
name: nonsense_labels
grid:
  universe: [string, reactome_fi, huri]
  graph: [string, reactome_fi, huri]
  copy: [real, rw0, empty]
  labels: [minikel_perm, minikel_famperm]
  feats: [all]
  split: [random]
  seed: [0, 1, 2, 3, 4]
  model: [deg_lr, rf_struct, labelprop, mlp_feat, rf_feat, mlp_feat_struct, rf_feat_struct,
          sign_feat, cs_feat, gcn_none, gcn_feat, sage_feat, gat_none, gat_feat, gat_edge_feat, gp]
  loss: [nnpu, pn]
