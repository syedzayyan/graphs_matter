[project]
name = "targetsplit"
version = "0.2.0"
description = "Time-split benchmark for drug-target prioritisation: new targets vs rediscovery"
readme = "README.md"
authors = [{ name = "Zayyan" }]
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["numpy", "pandas", "scipy"]

[project.optional-dependencies]
baselines = ["scikit-learn"]
pu = ["scikit-learn", "pulearn>=0.2"]

[project.scripts]
targetsplit = "targetsplit.cli:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["targetsplit*"]
